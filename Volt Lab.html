<style>

<script>
(() => {
'use strict';
const G = 36;
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
const BULB_R = 12, BULB_P = 6.75, SRC_R = 0.05, WIRE_G = 1000, GMIN = 1e-9;
const LED_COLORS = { red: { vf: 1.8, hex: '#ff3b30' }, green: { vf: 2.2, hex: '#1fd27a' }, blue: { vf: 3.0, hex: '#3d8bff' }, yellow: { vf: 2.0, hex: '#ffc400' } };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const TYPES = {
  battery:   { name: 'Battery', props: { V: 9 }, desc: 'Pushes charge around the circuit. The long plate is the positive (+) terminal. Its voltage is the size of the push.' },
  bulb:      { name: 'Bulb', props: {}, desc: 'A thin filament (12 Ω) that glows when current heats it. Rated 9 V, 6.75 W: brightness follows the power it receives.' },
  switch:    { name: 'Switch', props: { closed: false }, desc: 'A gap you control. Closed, it completes the loop. Open, no current can flow. Tap it on the board to toggle.' },
  resistor:  { name: 'Resistor', props: { R: 100 }, desc: 'Limits current. Resistance is measured in ohms (Ω). Electrical energy becomes heat inside it.' },
  ammeter:   { name: 'Ammeter', props: {}, desc: 'Measures current in amperes. Place it in series, inside the loop, so the current passes through it. Positive when current enters the + side.' },
  voltmeter: { name: 'Voltmeter', props: {}, desc: 'Measures the voltage between its two leads. Connect it across a part, in parallel. Its huge resistance (10 MΩ) barely disturbs the circuit.' },
  fuse:      { name: 'Fuse', props: { A: 1 }, desc: 'A thin wire that melts when current exceeds its rating, protecting the rest of the circuit. Select a blown fuse to replace it.' },
  motor:     { name: 'Motor', props: {}, desc: 'A DC motor (6 Ω coil). Current through the coil makes it spin. Reverse the current and it spins the other way.' },
  led:       { name: 'LED', props: { color: 'red' }, desc: 'Light-emitting diode. Conducts only from anode (triangle) to cathode (bar), once the forward voltage is reached. More than 50 mA burns it out.' },
  diode:     { name: 'Diode', props: {}, desc: 'A one-way valve for current: flows from anode (triangle) to cathode (bar) with about 0.7 V drop, blocked in reverse.' },
  capacitor: { name: 'Capacitor', props: { C: 1000 }, desc: 'Two plates separated by an insulator. It stores charge and energy, charging and discharging over time through a resistor.' },
  inductor:  { name: 'Inductor', props: { L: 5 }, desc: 'A coil that stores energy in a magnetic field and resists changes in current. Breaking its circuit causes a voltage spike.' },
  ac:        { name: 'AC source', props: { V: 9, f: 1 }, desc: 'Alternating voltage that follows a sine wave and reverses direction every half cycle. Slowed down here so you can see it.' },
  wire:      { name: 'Wire', props: {}, desc: 'A copper conductor with almost no resistance. Wires connect only at their end dots.' }
};
const PALETTE = ['battery', 'bulb', 'switch', 'resistor', 'ammeter', 'voltmeter', 'fuse', 'motor', 'led', 'diode', 'capacitor', 'inductor', 'ac'];

const CONTROLS = {
  battery:   [{ k: 'V', label: 'Voltage', min: 1.5, max: 24, step: 0.5, unit: 'V' }],
  ac:        [{ k: 'V', label: 'Peak voltage', min: 1, max: 24, step: 0.5, unit: 'V' }, { k: 'f', label: 'Frequency', min: 0.2, max: 10, step: 0.1, unit: 'Hz' }],
  resistor:  [{ k: 'R', label: 'Resistance', min: 1, max: 100000, log: true, unit: 'Ω' }],
  capacitor: [{ k: 'C', label: 'Capacitance', min: 10, max: 10000, log: true, unit: 'µF' }],
  inductor:  [{ k: 'L', label: 'Inductance', min: 0.1, max: 20, step: 0.1, unit: 'H' }],
  fuse:      [{ k: 'A', label: 'Rating', min: 0.1, max: 5, step: 0.1, unit: 'A' }]
};

// ---------- State ----------
let S = { comps: [], wires: [], next: 1, t: 0 };
let sel = null, running = true, speed = 1, zoom = 1;
const view = { scale: 1, ox: 0, oy: 0, w: 0, h: 0 };
let col = {};
let shortAmps = 0;

function mk(type, x, y, rot = 0, props = {}) {
  return { id: S.next++, type, x, y, rot, props: { ...TYPES[type].props, ...props }, st: {}, v: 0, i: 0, phase: 0 };
}
function mkWire(x1, y1, x2, y2) {
  return { id: S.next++, type: 'wire', a: [x1, y1], b: [x2, y2], st: {}, v: 0, i: 0, phase: 0 };
}
function terms(e) {
  if (e.type === 'wire') return [e.a, e.b];
  const d = DIRS[e.rot];
  return [[e.x, e.y], [e.x + 2 * d[0], e.y + 2 * d[1]]];
}
function wirePts(w) {
  const pts = [w.a, [w.b[0], w.a[1]], w.b];
  return pts.filter((p, k) => k === 0 || p[0] !== pts[k - 1][0] || p[1] !== pts[k - 1][1]);
}
const key = p => p[0] + ',' + p[1];
const allEls = () => [...S.wires, ...S.comps];

// ---------- Simulation (nodal analysis) ----------
function vfOf(e) { return e.type === 'led' ? (LED_COLORS[e.props.color] || LED_COLORS.red).vf : 0.7; }
function rsOf(e) { return e.type === 'led' ? 10 : 0.5; }

function stampEl(e, A, B, dt) {
  let g = 0, c = 0;
  const p = e.props;
  switch (e.type) {
    case 'wire': case 'ammeter': g = WIRE_G; break;
    case 'resistor': g = 1 / Math.max(p.R, 1e-3); break;
    case 'bulb': g = 1 / BULB_R; break;
    case 'motor': g = 1 / 6; break;
    case 'switch': g = p.closed ? WIRE_G : 0; break;
    case 'voltmeter': g = 1e-7; break;
    case 'fuse': g = e.st.blown ? 0 : 100; break;
    case 'battery': g = 1 / SRC_R; c = p.V * g; break;
    case 'ac': g = 1 / SRC_R; c = p.V * Math.sin(2 * Math.PI * p.f * S.t) * g; break;
    case 'capacitor': g = (p.C * 1e-6) / dt; c = -g * (e.st.vc || 0); break;
    case 'inductor': g = dt / p.L; c = e.st.il || 0; break;
    case 'led': case 'diode':
      if (e.st.burnt) g = 0;
      else if (e.st.on) { g = 1 / rsOf(e); c = -g * vfOf(e); }
      else g = GMIN;
      break;
  }
  e._g = g; e._c = c;
  const a = e._a, b = e._b;
  if (a === b) return;
  if (g) { A[a][a] += g; A[b][b] += g; A[a][b] -= g; A[b][a] -= g; }
  if (e.type === 'inductor') { const gp = 1e-4; A[a][a] += gp; A[b][b] += gp; A[a][b] -= gp; A[b][a] -= gp; }
  B[a] -= c; B[b] += c;
}

function gauss(A, B, n) {
  for (let c = 0; c < n; c++) {
    let p = c, m = Math.abs(A[c][c]);
    for (let r = c + 1; r < n; r++) { const v = Math.abs(A[r][c]); if (v > m) { m = v; p = r; } }
    if (m < 1e-18) continue;
    if (p !== c) { const t = A[p]; A[p] = A[c]; A[c] = t; const tb = B[p]; B[p] = B[c]; B[c] = tb; }
    const Ac = A[c], piv = Ac[c];
    for (let r = c + 1; r < n; r++) {
      const Ar = A[r], f = Ar[c] / piv;
      if (f === 0) continue;
      for (let k = c; k < n; k++) Ar[k] -= f * Ac[k];
      B[r] -= f * B[c];
    }
  }
  const x = new Float64Array(n);
  for (let r = n - 1; r >= 0; r--) {
    let s = B[r]; const Ar = A[r];
    for (let k = r + 1; k < n; k++) s -= Ar[k] * x[k];
    x[r] = Math.abs(Ar[r]) > 1e-18 ? s / Ar[r] : 0;
  }
  return x;
}

function simulate(dt) {
  const els = allEls();
  shortAmps = 0;
  if (!els.length) return;
  const idx = new Map(); let n = 0;
  const nid = p => { const k = key(p); let v = idx.get(k); if (v === undefined) { v = n++; idx.set(k, v); } return v; };
  for (const e of els) { const [pa, pb] = terms(e); e._a = nid(pa); e._b = nid(pb); }
  // nets joined by wires (used by lesson checks)
  const par = Array.from({ length: n }, (_, k) => k);
  const find = k => { while (par[k] !== k) { par[k] = par[par[k]]; k = par[k]; } return k; };
  for (const w of S.wires) par[find(w._a)] = find(w._b);
  for (const e of els) { e._na = find(e._a); e._nb = find(e._b); }

  let V;
  for (let iter = 0; iter < 16; iter++) {
    const A = Array.from({ length: n }, () => new Float64Array(n));
    const B = new Float64Array(n);
    for (let k = 0; k < n; k++) A[k][k] += GMIN;
    for (const e of els) stampEl(e, A, B, dt);
    V = gauss(A, B, n);
    let changed = false;
    for (const e of els) {
      if ((e.type !== 'led' && e.type !== 'diode') || e.st.burnt) continue;
      const v = V[e._a] - V[e._b], vf = vfOf(e);
      if (!e.st.on && v > vf + 1e-6) { e.st.on = true; changed = true; }
      else if (e.st.on && (v - vf) / rsOf(e) < -1e-9) { e.st.on = false; changed = true; }
    }
    if (!changed) break;
  }
  for (const e of els) {
    const v = V[e._a] - V[e._b];
    e.v = v;
    e.i = e._g * v + e._c;
    switch (e.type) {
      case 'capacitor': e.st.vc = v; break;
      case 'inductor': e.st.il = e.i; break;
      case 'fuse': if (!e.st.blown && Math.abs(e.i) > e.props.A) { const amps = Math.abs(e.i); e.st.blown = true; e.i = 0; toast(`Fuse blown at ${fmt(amps, 'A')}. Too much current!`); } break;
      case 'led': if (!e.st.burnt && e.i > 0.05) { e.st.burnt = true; e.st.on = false; toast('The LED burned out. Add a series resistor to limit its current.'); } break;
      case 'motor': e.st.ang = (e.st.ang || 0) + e.i * dt * 9; break;
      case 'battery': case 'ac': shortAmps = Math.max(shortAmps, Math.abs(e.i)); break;
    }
  }
}

// ---------- Helpers ----------
function fmt(x, u, dg = 3) {
  if (!isFinite(x)) return '—';
  const a = Math.abs(x); let p = '';
  if (a < 1e-6) { x = 0; }
  else if (a >= 1e6) { x /= 1e6; p = 'M'; }
  else if (a >= 1e3) { x /= 1e3; p = 'k'; }
  else if (a >= 1) { }
  else if (a >= 1e-3) { x *= 1e3; p = 'm'; }
  else { x *= 1e6; p = 'µ'; }
  return `${+x.toPrecision(dg)} ${p}${u}`;
}
const bright = e => e.type === 'bulb' ? (e.v * e.v / BULB_R) / BULB_P : 0;
const resistanceOf = e => ({ resistor: e.props.R, bulb: BULB_R, motor: 6 })[e.type];

function valueLabel(e) {
  const p = e.props;
  switch (e.type) {
    case 'battery': return `${p.V} V`;
    case 'ac': return `${p.V} V · ${p.f} Hz`;
    case 'resistor': return fmt(p.R, 'Ω');
    case 'capacitor': return fmt(p.C * 1e-6, 'F');
    case 'inductor': return `${p.L} H`;
    case 'fuse': return e.st.blown ? 'BLOWN' : `${p.A} A`;
    case 'led': return e.st.burnt ? 'burnt out' : p.color;
    case 'ammeter': return fmt(e.i, 'A');
    case 'voltmeter': return fmt(e.v, 'V');
    case 'switch': return p.closed ? 'closed' : 'open';
    default: return '';
  }
}

// ---------- Drawing ----------
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['bg', 'panel', 'ink', 'muted', 'line', 'board', 'grid', 'copper', 'current', 'amp', 'good', 'bad', 'sel', 'chip'])
    col[k] = cs.getPropertyValue('--' + k).trim();
}

function line(ctx, x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function circle(ctx, x, y, r, fill, stroke) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) ctx.stroke(); }

// Draws a part in its local frame: leads run from x=-G to x=+G, terminal a on the left.
function drawSymbol(ctx, e, ang) {
  const p = e.props, st = e.st;
  ctx.strokeStyle = col.ink; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const text = (s, size = 13) => {
    ctx.save(); ctx.rotate(-ang); ctx.fillStyle = col.ink; ctx.font = `700 ${size}px "JetBrains Mono", monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, 0, 1); ctx.restore();
  };
  switch (e.type) {
    case 'resistor': {

  dropPreview = null; pdrag = null;
}
function addAtFreeSpot(type) {
  const used = new Set();
  for (const e of allEls()) { for (const p of terms(e)) used.add(key(p)); if (e.type !== 'wire') { const [cx, cy] = compCenter(e).map(v => v / G); used.add(key([cx, cy])); } }
  const cols = Math.max(6, Math.floor((view.w - view.ox) / view.scale / G) - 3);
  for (let y = 2; y < 30; y += 2) for (let x = 2; x < cols; x += 3) {
    if (![[x, y], [x + 1, y], [x + 2, y]].some(p => used.has(key(p)))) {
      const c = mk(type, x, y, 0); S.comps.push(c); select(c); save(); toast(`${TYPES[type].name} added. Drag it into place.`); return;
    }
  }
}

  else if (e.type === 'voltmeter') rows.push(['Reading', fmt(e.v, 'V')]);
  else { rows.push(['Voltage across', fmt(V, 'V')], ['Current', fmt(I, 'A')], ['Power', fmt(Math.abs(e.v * e.i), 'W')]); }

  if (e.type === 'capacitor') { const C = e.props.C * 1e-6; rows.push(['Charge Q = CV', fmt(C * V, 'C')], ['Energy ½CV²', fmt(0.5 * C * V * V, 'J')]); }

  if (e.type === 'led' || e.type === 'diode') rows.push(['State', e.st.burnt ? 'burnt out' : e.st.on ? 'conducting' : 'blocking']);

}

function seriesLoop(items, src = ['battery', {}]) {
  const comps = [mk(src[0], 3, 9, 3, src[1])], wires = [mkWire(3, 7, 3, 3)];
  let cur = 3; const placed = [];
  for (const [t, p] of items) { wires.push(mkWire(cur, 3, cur + 1, 3)); const c = mk(t, cur + 1, 3, 0, p); comps.push(c); placed.push(c); cur += 3; }
  wires.push(mkWire(cur, 3, cur + 1, 3));
  const right = cur + 1;
  wires.push(mkWire(right, 3, right, 9), mkWire(right, 9, 3, 9));
  return { comps, wires, placed };
}
function across(board, item, type = 'voltmeter', props = {}) {
  const x = item.x;
  board.wires.push(mkWire(x, 3, x, 5), mkWire(x + 2, 5, x + 2, 3));
  board.comps.push(mk(type, x, 5, 0, props));
  return board;
}
const all = t => S.comps.filter(c => c.type === t);
const sameNets = (m, e) => (m._na === e._na && m._nb === e._nb) || (m._na === e._nb && m._nb === e._na);

  if (nx) nx.addEventListener('click', () => setLesson(current + 1));
  const L = LESSONS[current], isDone = done.has(current);
  stripEl.innerHTML = `<div class="min-w-0 flex-1"><div class="eyebrow">Lesson ${current + 1} · ${L.title}</div><p class="text-[13px] mt-0.5">${L.task}</p></div><span class="pill ${isDone ? 'pill-done' : 'pill-wait'} mt-0.5">${isDone ? 'Complete' : 'Not yet'}</span>`;
  document.getElementById('progress').textContent = `${done.size} / ${LESSONS.length}`;
}
function setLesson(k) { current = k; lmem = {}; confirmLoad = false; renderLessons(); store('voltlab.lesson', k); }
function checkLesson() {
  if (done.has(current)) return;
  let ok = false;
  try { ok = LESSONS[current].check(lmem); } catch (e) { ok = false; }
  if (ok) { done.add(current); store('voltlab.done', [...done]); renderLessons(); toast(`Lesson ${current + 1} complete. Nice work!`); }
}

// ---------- Persistence ----------
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function recall(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
let dirty = false;
function save() { dirty = true; }
setInterval(() => {
  if (!dirty) return; dirty = false;
  store('voltlab.board', { comps: S.comps.map(c => ({ type: c.type, x: c.x, y: c.y, rot: c.rot, props: c.props })), wires: S.wires.map(w => ({ a: w.a, b: w.b })) });
}, 1500);
function loadBoard(b) {
  S.comps = b.comps; S.wires = b.wires; S.t = 0; hist = []; lmem = {};
  select(null); save();
}
function restore() {
  const b = recall('voltlab.board');
  if (b && (b.comps.length || b.wires.length)) {
    S.comps = b.comps.filter(c => TYPES[c.type]).map(c => mk(c.type, c.x, c.y, c.rot, c.props));
    S.wires = b.wires.map(w => mkWire(w.a[0], w.a[1], w.b[0], w.b[1]));
  } else {
    const ex = LESSONS[0].build(); S.comps = ex.comps; S.wires = ex.wires;
  }
  const d = recall('voltlab.done'); if (Array.isArray(d)) done = new Set(d.filter(n => n < LESSONS.length));
  const l = recall('voltlab.lesson'); if (Number.isInteger(l) && l < LESSONS.length) current = l;
}

// ---------- UI chrome ----------
const toastEl = document.getElementById('toast'); let toastT;
function toast(msg) {
  toastEl.textContent = msg; toastEl.style.opacity = 1; toastEl.style.transform = 'translateY(0)';
  clearTimeout(toastT); toastT = setTimeout(() => { toastEl.style.opacity = 0; toastEl.style.transform = 'translateY(8px)'; }, 2800);
}
const runBtn = document.getElementById('btn-run');
runBtn.addEventListener('click', () => { running = !running; runBtn.textContent = running ? '❚❚ Pause' : '▶ Play'; runBtn.setAttribute('aria-label', running ? 'Pause simulation' : 'Play simulation'); });
document.getElementById('speed').addEventListener('change', e => speed = +e.target.value);
document.getElementById('zoom-in').addEventListener('click', () => { zoom = Math.min(2, zoom * 1.2); resize(); });
document.getElementById('zoom-out').addEventListener('click', () => { zoom = Math.max(0.5, zoom / 1.2); resize(); });
let clearArm = false; const clearBtn = document.getElementById('btn-clear');
clearBtn.addEventListener('click', () => {
  if (!clearArm) { clearArm = true; clearBtn.textContent = 'Click again to clear'; setTimeout(() => { clearArm = false; clearBtn.textContent = 'Clear board'; }, 3000); return; }
  clearArm = false; clearBtn.textContent = 'Clear board'; loadBoard({ comps: [], wires: [] }); toast('Board cleared');
});

const banner = document.getElementById('banner'), clock = document.getElementById('clock');
function refreshTheme() { readColors(); buildPalette(); if (sel) buildInspector(); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', refreshTheme);
new MutationObserver(refreshTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
new ResizeObserver(resize).observe(canvas);

// ---------- Main loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  const dtReal = Math.min(0.05, (now - last) / 1000); last = now;
  const total = running ? dtReal * speed : 0;
  const steps = 4, h = Math.max(total / steps, 1e-6);
  if (running) for (let k = 0; k < steps; k++) { S.t += h; simulate(h); }
  else simulate(1e-6);
  if (running && !reduceMotion) for (const e of allEls()) {
    const a = Math.abs(e.i);
    const v = a < 2e-4 ? 0 : Math.sign(e.i) * Math.min(150, 55 * Math.log10(1 + a * 200));
    e.phase += v * dtReal * Math.min(speed, 1.5);
  }
  if (sel && running) { hist.push([S.t, sel.v, sel.i]); while (hist.length && hist[0][0] < S.t - 8) hist.shift(); }
  banner.hidden = shortAmps < 8;
  if (shortAmps >= 8) banner.textContent = `Short circuit! ${fmt(shortAmps, 'A')} through the source`;
  clock.textContent = `t = ${S.t.toFixed(1)} s${running ? '' : ' · paused'}`;
  render(); drawScope();
  acc += dtReal;
  if (acc > 0.15) { acc = 0; updateReadings(); checkLesson(); }
  requestAnimationFrame(frame);
}

readColors();
restore();
buildPalette();
renderLessons();
buildInspector();
resize();
requestAnimationFrame(frame);
})();
</script>

</body></html>
